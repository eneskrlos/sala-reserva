spring:
  application:
    name: sala-reserva

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/sala_reserva}
    username: ${DB_USER:sala}
    password: ${DB_PASSWORD:sala}

  jpa:
    hibernate:
      ddl-auto: validate   # El esquema lo gobierna Flyway, no Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Documentación OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
